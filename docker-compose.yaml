version: '3'

services:
  frontend:
    build: ../frontend
    image: frontend
    ports:
      - "8080:80"
  bosses-db:
    image: mysql:8.4.7
    environment:
      - MYSQL_DATABASE=BOSS_DB
      - MYSQL_PASSWORD=secret
      - MYSQL_ROOT_PASSWORD=verysecret
      - MYSQL_USER=myuser
    ports:
      - "3306:3306"
  boss-container:
    image: boss-services
    build: ../Boss-Service
    ports:
      - "8081:8080"
    environment:
      - BOSS_DB=production
      - "MYSQL_DATABASE=BOSS_DB"
      - 'MYSQL_USER=myuser'
      - 'MYSQL_PASSWORD=secret'
      - 'MYSQL_HOST=bosses-db'
      - 'EUREKA_URL=http://discovery-container:8761/eureka'
  employees-db:
    image: mysql:8.4.7
    environment:
      - MYSQL_DATABASE=EMPLOYEE_DB
      - MYSQL_PASSWORD=secret
      - MYSQL_ROOT_PASSWORD=verysecret
      - MYSQL_USER=myuser
    ports:
      - "3307:3306"
  employee-container:
    build: ../Employee-Service
    image: employee-service
    ports:
      - "8082:8080"
    environment:
      - EMPLOYEE_DB=production
      - "MYSQL_DATABASE=EMPLOYEE_DB"
      - 'MYSQL_USER=myuser'
      - 'MYSQL_PASSWORD=secret'
      - 'MYSQL_HOST=employees-db'
      - 'EUREKA_URL=http://discovery-container:8761/eureka'
  discovery-container:
    build: ../Discovery-Service
    image: discovery-service
    ports:
      - "8761:8761"
  employee-container2:
    build: ../Employee-Service
    image: employee-service
    ports:
      - "8083:8080"
    environment:
      - EMPLOYEE_DB=production
      - "MYSQL_DATABASE=EMPLOYEE_DB"
      - 'MYSQL_USER=myuser'
      - 'MYSQL_PASSWORD=secret'
      - 'MYSQL_HOST=employees-db'
      - 'EUREKA_URL=http://discovery-container:8761/eureka'
