spring.application.name=spring-gateway

server.port=8080

spring.cloud.gateway.server.webmvc.routes[1].id=boss-service
spring.cloud.gateway.server.webmvc.routes[1].uri=http://boss-container:8080
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/bosses/**

spring.cloud.gateway.server.webmvc.routes[0].id=employee-service
spring.cloud.gateway.server.webmvc.routes[0].uri=http://employee-container:8080
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/bosses/*/employees/**