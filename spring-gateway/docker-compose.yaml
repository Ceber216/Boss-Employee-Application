version: '3'

services:
  frontend:
    image: frontend-app
    ports:
      - "8080:80"
  boss-container:
    image: boss-container
    ports:
      - "8081:80"
    environment:
      - BOSS_DB=production
  employee-container:
    image: employee-container
    ports:
      - "8082:80"
    environment:
      - EMPLOYEE_DB=production