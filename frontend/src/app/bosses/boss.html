<main class="main">
  <div class="content">
    <div class="left-side">
      <table class="table1">
        <thead>
          <tr>
            <th scope="col">Name</th>
            <th scope="col">Salary</th>
            <th scope="col">Delete</th>
            <th scope="col">Edit</th>
            <th scope="col">Details</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let boss of bosses">
            <td> {{boss.name}}</td>
            <td> {{boss.salary}}</td>
            <td>
              <button class="delete_button"(click)="onDeletePressed(boss)">Delete</button>
            </td>
            <td>
              <button class="edit_button" (click)="onEditPressed(boss)">Edit</button>
            </td>
            <td>
              <button class="details_button" (click)="onDetailsPressed(boss)">Details</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <div class="divider" role="separator" aria-label="Divider"></div>
    <div class="right-side">
      <h2>{{ isEditing() ? 'Edit Boss' : 'Add New Boss' }}</h2>
      <form [formGroup]="bossForm" (ngSubmit)="onSubmitPressed()">

        <label for="name">Name:</label>
        <input type = "text" id="name" name="name" placeholder="Write boss name" formControlName="name">
        <br><br>

        <label for="salary">Salary:</label>
        <input type = "text" id="salary" name="salary" placeholder="Write boss salary" formControlName="salary">
        <br><br>

        <div class="form-actions">
          <button type="submit" [disabled]="bossForm.invalid">
            {{ isEditing() ? 'Save Changes' : 'Send' }}
          </button>

          <button type="button" *ngIf="isEditing()" (click)="cancelEdit()">Cancel</button>
        </div>
      </form>
    </div>
  </div>
</main>
